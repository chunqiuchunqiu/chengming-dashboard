name: Weekly A-share research report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-a-share-report.yml"
      - "scripts/generate_a_share_report.py"
      - "requirements-a-share.txt"
  schedule:
    - cron: "0 12 * * 6" # Saturday 20:00 Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: weekly-a-share-report
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-a-share.txt
      - name: Install read-only data dependencies
        run: python -m pip install --requirement requirements-a-share.txt
      - name: Generate and store report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          # Public endpoint, not a credential. Keeping it here avoids copy/paste truncation in Actions Variables.
          DASHBOARD_INGEST_URL: https://chengming-personal-board.cloudy-chick-2433.chatgpt.site/api/admin/stock-reports
          REPORT_INGEST_SECRET: ${{ secrets.REPORT_INGEST_SECRET }}
          SITES_BYPASS_TOKEN: ${{ secrets.SITES_BYPASS_TOKEN }}
        shell: bash
        run: |
          for attempt in 1 2; do
            python scripts/generate_a_share_report.py && exit 0
            echo "data provider attempt ${attempt} failed"
            sleep 30
          done
          exit 1
